name: thewitch

x-llm-image: &llm-image
  build:
    context: ArtificialIntelligence/servers/llm_server
    dockerfile: Containerfile
    args:
      OLLAMA_PORT: ${WITCH_LLM_PORT}
      OLLAMA_MODEL: ${WITCH_LLM_MODEL}
  image: localhost/thewitch-llm:latest

x-tts-image: &tts-image
  build:
    context: ArtificialIntelligence/servers/tts_server
    dockerfile: Containerfile
    args:
      WITCH_TTS_PORT: ${WITCH_TTS_PORT}
      WITCH_TTS_MODEL: ${WITCH_TTS_MODEL}
  image: localhost/thewitch-tts:latest

services:
  ai:
    build:
      context: .
      dockerfile: ArtificialIntelligence/Containerfile
      args:
        WITCH_AI_PORT: ${WITCH_AI_PORT}
        WITCH_AI_UI_PORT: ${WITCH_AI_UI_PORT}
    image: localhost/thewitch-ai:latest
    env_file: [.env]
    ports:
      - "${WITCH_AI_UI_PORT}:${WITCH_AI_UI_PORT}"
      - "${WITCH_AI_PORT}:${WITCH_AI_PORT}"
    volumes:
      - ./ArtificialIntelligence:/app/ArtificialIntelligence:ro,Z
      - ./shared:/app/shared:ro,Z
    restart: unless-stopped
    networks: [witch-net]

  llm:
    <<: *llm-image
    env_file: [.env]
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "${WITCH_LLM_PORT}:${WITCH_LLM_PORT}"
    restart: unless-stopped
    networks: [witch-net]

  tts:
    <<: *tts-image
    env_file: [.env]
    volumes:
      - tts_models:/root/.local/share/tts
      - ./ArtificialIntelligence/assets:/assets:ro
      - ./ArtificialIntelligence/servers/tts_server:/app:ro,Z
    ports:
      - "${WITCH_TTS_PORT}:${WITCH_TTS_PORT}"
    restart: unless-stopped
    networks: [witch-net]

  ip:
    build:
      context: .
      dockerfile: ImageProcessing/Containerfile
    privileged: true
    env_file: [.env]
    volumes:
      - ./ImageProcessing:/app/ImageProcessing:ro
    restart: unless-stopped
    networks: [witch-net]

volumes:
  ollama_models:
  tts_models:

networks:
  witch-net:
    driver: bridge
