name: thewitch

x-vllm-image: &vllm-image
  build:
    context: ArtificialIntelligence/servers/vllm_server
    dockerfile: Containerfile
  image: localhost/thewitch-vllm:latest

services:
  ai:
    build:
      context: .
      dockerfile: ArtificialIntelligence/Containerfile
      args:
        WITCH_AI_PORT: ${WITCH_AI_PORT}
        WITCH_AI_UI_PORT: ${WITCH_AI_UI_PORT}
    image: localhost/thewitch-ai:latest
    env_file: [.env]
    ports:
      - "${WITCH_AI_UI_PORT}:${WITCH_AI_UI_PORT}"
      - "${WITCH_AI_PORT}:${WITCH_AI_PORT}"
    volumes:
      - ./ArtificialIntelligence:/app/ArtificialIntelligence:ro,Z
      - ./shared:/app/shared:ro,Z
    restart: unless-stopped
    networks: [witch-net]

  vllm:
    <<: *vllm-image
    env_file: [.env]
    volumes:
      - vllm_models:/root/.cache/huggingface
    ports:
      - "${WITCH_LLM_PORT}:${WITCH_LLM_PORT}"
      - "${WITCH_TTS_PORT}:${WITCH_TTS_PORT}"
    restart: unless-stopped
    networks: [witch-net]

  ip:
    build:
      context: .
      dockerfile: ImageProcessing/Containerfile
    privileged: true
    env_file: [.env]
    volumes:
      - ./ImageProcessing:/app/ImageProcessing:ro
    restart: unless-stopped
    networks: [witch-net]

volumes:
  vllm_models:

networks:
  witch-net:
    driver: bridge
