<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>The Witch Debug</title>
        <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
        <style>
            :root {
                color-scheme: dark;
                --bg: #101113;
                --panel: #17191d;
                --text: #e9eaec;
                --muted: #989da6;
                --line: #2b2f36;
                --accent: #f0c36a;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                height: 100vh;
                overflow: hidden;
                display: grid;
                grid-template-rows: auto minmax(0, 1fr);
                background: var(--bg);
                color: var(--text);
                font:
                    14px/1.45 system-ui,
                    sans-serif;
            }
            .body,
            .debug-layout,
            .grid,
            .videos {
                display: grid;
                gap: 12px;
            }
            main {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                grid-template-rows: auto auto minmax(0, 1fr);
                min-height: 0;
                gap: 12px;
                padding: 16px;
            }
            .debug-layout {
                display: contents;
            }
            .debug-layout > .panel:first-child {
                grid-column: 1;
                grid-row: 1;
            }
            .debug-layout > .panel:last-child {
                grid-column: 1;
                grid-row: 2;
            }
            .grid {
                grid-column: 1;
                grid-row: 3;
            }
            .videos {
                grid-template-columns: 1fr 1fr;
                min-height: 0;
            }
            .videos > div {
                min-width: 0;
                min-height: 0;
                display: grid;
                grid-template-rows: auto auto;
            }
            .grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                min-height: 0;
            }
            .panel {
                min-width: 0;
                min-height: 0;
                border: 1px solid var(--line);
                background: var(--panel);
                border-radius: 8px;
                overflow: hidden;
            }
            .debug-layout > .panel:first-child,
            .grid > .panel,
            .state-machine-panel {
                display: grid;
                grid-template-rows: 38px minmax(0, 1fr);
            }
            .head {
                display: flex;
                align-items: center;
                gap: 8px;
                height: 38px;
                padding: 0 12px;
                border-bottom: 1px solid var(--line);
            }
            h2,
            .video-label {
                margin: 0;
                color: var(--muted);
                font-size: 12px;
                font-weight: 650;
                text-transform: uppercase;
            }
            button {
                height: 30px;
                border: 1px solid var(--line);
                background: #20242a;
                color: var(--text);
                border-radius: 6px;
                padding: 0 10px;
                font: inherit;
                font-size: 12px;
            }
            button:hover {
                background: #2a3038;
            }
            .body,
            .videos {
                padding: 12px;
            }
            .state {
                color: var(--accent);
                font:
                    13px ui-monospace,
                    monospace;
            }
            .video-label {
                margin-bottom: 6px;
                font-size: 11px;
            }
            .stream-wrap {
                position: relative;
                width: 100%;
                aspect-ratio: var(--video-ratio, 16 / 9);
                background: #050608;
                border: 1px solid #0c0e12;
                border-radius: 6px;
                overflow: hidden;
            }
            canvas {
                display: block;
                width: 100%;
                height: 100%;
            }
            .overlay {
                position: absolute;
                left: 10px;
                bottom: 8px;
                padding: 3px 6px;
                border-radius: 4px;
                background: rgb(0 0 0 / 0.58);
                color: #d6d8dc;
                font-size: 11px;
            }
            pre {
                margin: 0;
                padding: 10px 12px;
                min-height: 0;
                max-height: none;
                overflow: auto;
                white-space: pre-wrap;
                overflow-wrap: anywhere;
                background: #111316;
                font:
                    12px ui-monospace,
                    monospace;
            }
            .wide {
                grid-column: 1 / -1;
            }
            .state-machine-panel {
                grid-column: 2;
                grid-row: 1 / -1;
            }
            .graph-tools {
                display: flex;
                align-items: center;
                gap: 4px;
                margin-left: auto;
            }
            .graph-tools button {
                min-width: 30px;
                padding: 0 8px;
            }
            #graphZoom {
                min-width: 46px;
                color: var(--muted);
                text-align: center;
                font: 11px ui-monospace, monospace;
            }
            #graphViewport {
                position: relative;
                height: auto;
                min-height: 0;
                overflow: hidden;
                cursor: grab;
                background-color: #090a0c;
                touch-action: none;
                user-select: none;
            }
            #graphViewport.panning {
                cursor: grabbing;
            }
            #graphContent {
                position: absolute;
                inset: 0;
            }
            #graphContent svg {
                display: block;
                width: 100% !important;
                height: 100% !important;
                max-width: none !important;
            }
        </style>
    </head>
    <body> 
        <header class="switcher">
            <button id="switchToDebugManual">Debug Manual UI</button>
        </header>
        <main>
            <section class="debug-layout">
                <section class="panel">
                    <div class="head"><h2>Videos</h2></div>
                    <div class="videos">
                        <div>
                            <div class="video-label">Video</div>
                            <div class="stream-wrap">
                                <canvas id="cameraCanvas"></canvas
                                ><span id="cameraFps" class="overlay"
                                    >0 fps</span
                                >
                            </div>
                        </div>
                        <div>
                            <div class="video-label">ROI</div>
                            <div class="stream-wrap">
                                <canvas id="roiCanvas"></canvas
                                ><span id="roiFps" class="overlay">0 fps</span>
                            </div>
                        </div>
                    </div>
                </section>
                <section class="panel">
                    <div class="head"><h2>AI Debug</h2></div>
                    <div class="body">
                        <div>
                            state:
                            <span id="currentState" class="state">-</span>
                        </div>
                        <div>
                            <button id="resetButton">Reset</button>
                        </div>
                    </div>
                </section>
            </section>

            <section class="grid">
                <section class="panel">
                    <div class="head"><h2>ImageProcessing</h2></div>
                    <pre id="ImageProcessingEvents">waiting...</pre>
                </section>
                <section class="panel">
                    <div class="head"><h2>ArtificialIntelligence</h2></div>
                    <pre id="ArtificialIntelligenceEvents">waiting...</pre>
                </section>
                <section class="panel">
                    <div class="head"><h2>Unreal</h2></div>
                    <pre id="UnrealEvents">waiting...</pre>
                </section>
            </section>

            <section class="panel state-machine-panel">
                <div class="head">
                    <h2>State Machine</h2>
                    <div class="graph-tools">
                        <button id="graphZoomOut" title="Zoom out">-</button>
                        <span id="graphZoom">100%</span>
                        <button id="graphZoomIn" title="Zoom in">+</button>
                        <button id="graphFit" title="Fit diagram">Fit</button>
                    </div>
                </div>
                <div id="graphViewport"><div id="graphContent"></div></div>
            </section>
        </main>

        <script>
            const API = location.origin;
            const $ = (id) => document.getElementById(id);
            let currentState = "";
            let graphRenderId = 0;
            const graphView = { scale: 1, x: 0, y: 0, initialized: false };
            mermaid.initialize({
                startOnLoad: false,
                theme: "dark",
                securityLevel: "loose",
            });

            addEventListener("DOMContentLoaded", init);
            $("resetButton").onclick = async () => {
                await fetch(`${API}/api/reset`, { method: "POST" });
                const changed = await updateState();
                if (!changed) loadGraph();
            };

            document.getElementById("switchToDebugManual").onclick = () => {
                window.location.href = "/debug_ui_manual.html";
            };

            async function init() {
                initGraphNavigation();
                const { ws_port } = await json("/api/config");
                const wsBase = `${location.protocol === "https:" ? "wss" : "ws"}://${location.hostname}:${ws_port}`;
                await updateState();
                stream("camera", `${wsBase}/ws/ai-3d-video`);
                stream("roi", `${wsBase}/ws/ai-3d-roi`);
                socket(`${wsBase}/ws/ip-ai`, (ev) => {
                    show(ev.origin, ev);
                    updateState();
                    loadGraph();
                });
                socket(`${wsBase}/ws/ai-3d`, (ev) => {
                    show(ev.origin, ev);
                    updateState();
                    loadGraph();
                });
            }

            async function json(path) {
                return (await fetch(`${API}${path}`)).json();
            }

            async function updateState() {
                const nextState = (await json("/api/state")).state || "-";
                $("currentState").textContent = nextState;
                if (nextState !== currentState) {
                    currentState = nextState;
                    loadGraph();
                    return true;
                }
                return false;
            }

            function socket(url, target, binary = false) {
                const showEvent =
                    typeof target === "function"
                        ? target
                        : (ev) => show(target, ev);
                const connect = () => {
                    const ws = new WebSocket(url);
                    if (binary) ws.binaryType = "arraybuffer";
                    ws.onerror = () => ws.close();
                    ws.onclose = () => setTimeout(connect, 1000);
                    ws.onmessage = (e) => {
                        try {
                            Promise.resolve(
                                showEvent(binary ? e.data : JSON.parse(e.data)),
                            ).catch(() => {});
                        } catch {}
                    };
                };
                connect();
            }

            function show(name, event) {
                $(`${name}Events`).textContent = JSON.stringify(
                    event,
                    null,
                    2,
                );
            }

            function stream(name, url) {
                const canvas = $(`${name}Canvas`);
                const ctx = canvas.getContext("2d", { alpha: false });
                const wrap = canvas.closest(".stream-wrap");
                let frames = 0,
                    lastTick = performance.now();
                ctx.fillStyle = "#000";

                new ResizeObserver(() => {
                    const r = canvas.getBoundingClientRect();
                    canvas.width = Math.max(
                        2,
                        Math.floor(r.width * devicePixelRatio),
                    );
                    canvas.height = Math.max(
                        2,
                        Math.floor(r.height * devicePixelRatio),
                    );
                }).observe(canvas);

                socket(
                    url,
                    async (data) => {
                        const bmp = await createImageBitmap(
                            new Blob([data], { type: "image/jpeg" }),
                        );
                        wrap.style.setProperty(
                            "--video-ratio",
                            `${bmp.width} / ${bmp.height}`,
                        );
                        const scale = Math.max(
                            canvas.width / bmp.width,
                            canvas.height / bmp.height,
                        );
                        const w = bmp.width * scale,
                            h = bmp.height * scale;
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(
                            bmp,
                            (canvas.width - w) / 2,
                            (canvas.height - h) / 2,
                            w,
                            h,
                        );
                        bmp.close();
                        frames++;
                        const now = performance.now();
                        if (now - lastTick >= 1000) {
                            $(`${name}Fps`).textContent =
                                `${Math.round((frames * 1000) / (now - lastTick))} fps`;
                            frames = 0;
                            lastTick = now;
                        }
                    },
                    true,
                );
            }

            let graphPending = false;
            function applyGraphTransform() {
                const viewport = $("graphViewport");
                const svg = $("graphContent").querySelector("svg");
                if (!svg) return;
                svg.setAttribute(
                    "viewBox",
                    [
                        -graphView.x / graphView.scale,
                        -graphView.y / graphView.scale,
                        viewport.clientWidth / graphView.scale,
                        viewport.clientHeight / graphView.scale,
                    ].join(" "),
                );
                $("graphZoom").textContent = `${Math.round(graphView.scale * 100)}%`;
            }

            function zoomGraph(factor, clientX, clientY) {
                const viewport = $("graphViewport");
                const rect = viewport.getBoundingClientRect();
                const px = (clientX ?? rect.left + rect.width / 2) - rect.left;
                const py = (clientY ?? rect.top + rect.height / 2) - rect.top;
                const next = Math.min(4, Math.max(0.1, graphView.scale * factor));
                const ratio = next / graphView.scale;
                graphView.x = px - (px - graphView.x) * ratio;
                graphView.y = py - (py - graphView.y) * ratio;
                graphView.scale = next;
                applyGraphTransform();
            }

            function fitGraph() {
                const viewport = $("graphViewport");
                const svg = $("graphContent").querySelector("svg");
                if (!svg) return;
                const width = Number(svg.dataset.graphWidth);
                const height = Number(svg.dataset.graphHeight);
                const padding = 40;
                graphView.scale = Math.max(
                    0.1,
                    Math.min(
                        1,
                        (viewport.clientWidth - padding * 2) / width,
                        (viewport.clientHeight - padding * 2) / height,
                    ),
                );
                graphView.x = (viewport.clientWidth - width * graphView.scale) / 2;
                graphView.y = (viewport.clientHeight - height * graphView.scale) / 2;
                graphView.initialized = true;
                applyGraphTransform();
            }

            function initGraphNavigation() {
                const viewport = $("graphViewport");
                let pan = null;
                viewport.addEventListener("wheel", (event) => {
                    event.preventDefault();
                    zoomGraph(Math.exp(-event.deltaY * 0.0015), event.clientX, event.clientY);
                }, { passive: false });
                viewport.addEventListener("pointerdown", (event) => {
                    pan = { x: event.clientX, y: event.clientY };
                    viewport.setPointerCapture(event.pointerId);
                    viewport.classList.add("panning");
                });
                viewport.addEventListener("pointermove", (event) => {
                    if (!pan) return;
                    graphView.x += event.clientX - pan.x;
                    graphView.y += event.clientY - pan.y;
                    pan = { x: event.clientX, y: event.clientY };
                    applyGraphTransform();
                });
                const stopPan = () => {
                    pan = null;
                    viewport.classList.remove("panning");
                };
                viewport.addEventListener("pointerup", stopPan);
                viewport.addEventListener("pointercancel", stopPan);
                viewport.addEventListener("dblclick", fitGraph);
                new ResizeObserver(() => applyGraphTransform()).observe(viewport);
                $("graphZoomOut").onclick = () => zoomGraph(0.8);
                $("graphZoomIn").onclick = () => zoomGraph(1.25);
                $("graphFit").onclick = fitGraph;
            }

            async function loadGraph() {
                if (graphPending) return;
                graphPending = true;
                setTimeout(async () => {
                    graphPending = false;
                    const div = $("graphContent");
                    const renderId = ++graphRenderId;
                    const { graph } = await json("/api/state-machine-graph");
                    try {
                        const rendered = await mermaid.render(
                            `g${Date.now()}-${renderId}`,
                            graph,
                        );
                        if (renderId === graphRenderId) {
                            div.innerHTML = rendered.svg;
                            const svg = div.querySelector("svg");
                            const box = svg.viewBox.baseVal;
                            svg.dataset.graphWidth = box.width;
                            svg.dataset.graphHeight = box.height;
                            svg.setAttribute("preserveAspectRatio", "none");
                            graphView.initialized ? applyGraphTransform() : fitGraph();
                        }
                    } catch {
                        if (renderId === graphRenderId) div.textContent = graph;
                    }
                }, 100);
            }
        </script>
    </body>
</html>
