# Unified Qwen3-TTS deploy config — VoiceDesign and inference.
# No limits on output — truncation is the caller's responsibility.
async_chunk: true
custom_voice_dir: ArtificialIntelligence/servers/tts/custom_voices

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      shm_threshold_bytes: 65536
      codec_streaming: true
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 25
      codec_left_context_frames: 72
      initial_codec_chunk_frames: 1

stages:
  - stage_id: 0
    max_num_seqs: 1
    gpu_memory_utilization: 0.3
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.8
      top_p: 1.0
      top_k: 50
      seed: 42
      repetition_penalty: 1.15
      stop_token_ids: [2150]
      detokenize: false
      max_tokens: 4096
    subtalker_sampling_params:
      do_sample: true
      temperature: 0.8
      top_k: 50
      top_p: 1.0

  - stage_id: 1
    max_num_seqs: 1
    gpu_memory_utilization: 0.3
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      seed: 42
      repetition_penalty: 1.0

platforms:
  npu:
    stages:
      - stage_id: 0
        enforce_eager: true
