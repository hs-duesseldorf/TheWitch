name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  witch-compose-smoke-test:
    name: Witch Compose smoke test on Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Build virtual environments
        run: |
          ./witch-compose --build

      - name: Start services
        run: |
          ./witch-compose up &
          COMPOSE_PID=$!
          sleep 30
          
          # Check if services are still running
          if ! kill -0 $COMPOSE_PID 2>/dev/null; then
            echo "Services failed to start"
            exit 1
          fi

      - name: Verify services health
        run: |
          # Give services time to initialize
          sleep 30
          
          # Check if AI service is responding on expected port
          if ! nc -z localhost 10031; then
            echo "AI service not responding on port 10031"
            exit 1
          fi

      - name: Show logs
        if: always()
        run: |
          ./witch-compose kill || true

      - name: Stop services
        if: always()
        run: |
          pkill -f witch_compose || true
