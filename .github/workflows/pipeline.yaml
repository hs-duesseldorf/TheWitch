name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  linux-smoke-test:
    name: Podman Compose smoke test on Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Podman Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y podman podman-compose

      - name: Check Podman Compose
        run: podman compose version

      - name: Build and start containers
        run: podman compose up --build -d

      - name: Let containers run for 60 seconds
        run: sleep 60

      - name: Verify containers are still running
        run: |
          podman compose ps

          if [ "$(podman compose ps -q --status exited | wc -l)" -gt 0 ]; then
            echo "One or more containers exited during the smoke test."
            podman compose logs
            exit 1
          fi

      - name: Show logs
        if: always()
        run: podman compose logs

      - name: Stop containers
        if: always()
        run: podman compose down
