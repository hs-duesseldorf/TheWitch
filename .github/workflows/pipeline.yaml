name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  linux-smoke-test:
    name: Docker Compose smoke test on Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Docker Compose
        run: docker compose version

      - name: Build and start containers
        run: docker compose up --build -d

      - name: Let containers run for 60 seconds
        run: sleep 60

      - name: Verify containers are still running
        run: |
          docker compose ps

          if [ "$(docker compose ps -q --status exited | wc -l)" -gt 0 ]; then
            echo "One or more containers exited during the smoke test."
            docker compose logs
            exit 1
          fi

      - name: Show logs
        if: always()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down
