; Linux desktop OpenGL fallback was removed by Unreal Engine. Keep Vulkan SM6,
; but avoid newer driver paths that can cause VK_ERROR_DEVICE_LOST while new
; material and editor-preview pipelines are created.

[ShaderPlatformConfig VULKAN_SM6]
BindlessConfiguration=Disabled

[/Script/Engine.RendererSettings]
; PSO precaching is already disabled in DefaultEngine.ini. These settings also
; serialize on-demand PSO creation and cache consolidation.
r.AsyncPipelineCompile=0
r.Vulkan.ForcePSOSingleThreaded=1
r.pso.EnableAsyncCacheConsolidation=0
