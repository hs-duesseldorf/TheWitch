[/Script/Engine.RendererSettings]
r.AllowStaticLighting=False

; Core rendering
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1

; Vulkan/Linux stability
r.PSOPrecaching=0
r.Vulkan.AllowPSOPrecaching=0
r.PSOPrecache.Components=0
r.PSOPrecache.Resources=0
r.PSOPrecache.GlobalShaders=0
r.ShaderPipelineCache.Enabled=0
r.ShaderPipelineCache.StartupMode=0
r.ShaderPipelineCache.LogPSO=0
r.ShaderPipelineCache.SaveAfterPSOsLogged=0
r.VSync=1
r.Vulkan.RHIThread=0
r.Vulkan.PipelineCacheLoad=0
r.Vulkan.PipelineCacheFromShaderPipelineCache=0
r.Vulkan.EnablePipelineLRUCache=0
r.Vulkan.ForcePacingWithoutVSync=1
r.Vulkan.ForcePSOSingleThreaded=1
r.Vulkan.EnableDefrag=1
r.Vulkan.RobustBufferAccess=1

; Ray tracing
; Use Lumen software tracing on Linux/Vulkan to avoid RT device loss.
r.RayTracing=False
r.RayTracing.EnableOnDemand=0
r.RayTracing.RayTracingProxies.ProjectEnabled=False
r.RayTracing.Shadows=False
r.RayTracing.UseTextureLod=True
r.PathTracing=0

; Lumen
r.Lumen.HardwareRayTracing=0
r.Lumen.TraceMeshSDFs=1
r.Lumen.ScreenTracingSource=1
r.Lumen.TranslucencyReflections.FrontLayer.EnableForProject=True

; Materials
r.Substrate=False
r.Substrate.ProjectGBufferFormat=0
r.Material.EnergyConservation=False
r.Material.RoughDiffuse=False

; Skin / MetaHuman
r.SkinCache.CompileShaders=True
r.GPUSkin.Support16BitBoneIndex=True
r.GPUSkin.UnlimitedBoneInfluences=True
SkeletalMesh.UseExperimentalChunking=1

; AA / Upscaling
; TSR is far more stable and memory-efficient than MSAA on Vulkan.
r.AntiAliasingMethod=4
r.MSAACount=1

; Exposure
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AutoExposure.Method=2
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8
r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8

; Visual defaults
r.DefaultFeature.Bloom=False
r.DefaultFeature.AmbientOcclusion=False
r.DefaultFeature.AmbientOcclusionStaticFraction=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.LightUnits=3

; Transparency
r.OIT.SortedPixels=True
r.LocalFogVolume.ApplyOnTranslucent=True

; Reflection captures
r.ReflectionCaptureResolution=128

[ConsoleVariables]

; =========================================================
; High-quality Lumen software tracing profile for Linux/Vulkan
; Keeps hardware ray tracing disabled to avoid GPU device loss
; =========================================================

; ---------- General ----------
r.MaxQualityMode=1
r.TextureStreaming=1
r.Streaming.UseFixedPoolSize=1
r.Streaming.PoolSize=4096
r.Streaming.Boost=1
r.Streaming.MipBias=0
r.Streaming.HiddenPrimitiveScale=0.5
r.Streaming.FullyLoadMeshes=0
r.Streaming.FullyLoadUsedTextures=0
r.Streaming.UseAllMips=0

; ---------- Lumen ----------
r.Lumen.HardwareRayTracing=0
r.Lumen.HardwareRayTracing.LightingMode=0

; Higher quality software Lumen reflections
r.Lumen.Reflections.HiResSurface=1

; Keep software reflections broad without enabling hardware RT
r.Lumen.Reflections.MaxBounces=2
r.Lumen.Reflections.MaxRoughnessToTrace=1.0

; Higher quality reconstruction
r.Lumen.Reflections.ScreenSpaceReconstruction.NumSamples=8

; Higher quality software GI accumulation
r.Lumen.ScreenProbeGather.Temporal.MaxFramesAccumulated=16
r.Lumen.ScreenProbeGather.DownsampleFactor=8
r.Lumen.ScreenProbeGather.TracingOctahedronResolution=16
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=32
r.Lumen.ScreenProbeGather.RadianceCache.NumProbesToTraceBudget=150
r.LumenScene.Radiosity.ProbeSpacing=2
r.LumenScene.Radiosity.HemisphereProbeResolution=8
r.LumenScene.Radiosity.UpdateFactor=32
r.LumenScene.DirectLighting.UpdateFactor=16
r.LumenScene.DirectLighting.MaxLightsPerTile=8
r.LumenScene.ViewDistance=20000
r.LumenScene.Detail=2
r.Lumen.FinalGather.Quality=2
r.Lumen.TraceMeshSDFs.Allow=1

; Hair AO tracing
r.Lumen.ScreenProbeGather.ShortRangeAO.HardwareRayTracing=0
r.Lumen.ScreenProbeGather.ShortRangeAO.HairScreenTrace=1
r.Lumen.ScreenProbeGather.ShortRangeAO.HairVoxelTrace=0

; ---------- Shadows ----------
; Virtual shadow maps are essential for realism
r.Shadow.MaxResolution=2048

; Higher quality virtual shadow maps
r.Shadow.Virtual.MaxPhysicalPages=2048
r.Shadow.Virtual.ResolutionLodBiasDirectional=-2
r.Shadow.Virtual.ResolutionLodBiasLocal=-1

; Higher quality virtual shadow sampling
r.Shadow.Virtual.SMRT.RayCountDirectional=12
r.Shadow.Virtual.SMRT.RayCountLocal=12
r.Shadow.Virtual.SMRT.SamplesPerRayDirectional=6
r.Shadow.Virtual.SMRT.SamplesPerRayLocal=6

; ---------- Hair / MetaHuman ----------
; High quality MetaHuman hair settings.

; Visibility
r.HairStrands.Visibility.MSAA.SamplePerPixel=4
r.HairStrands.Visibility.Compute.SamplePerPixel=4

; Voxelization
r.HairStrands.Voxelization.Virtual.VoxelWorldSize=0.3
r.HairStrands.Voxelization.Raymarching.SteppingScale=1.25
r.HairStrands.Voxelization.Raymarching.SteppingScale.Shadow=1.25

; Deep shadows
r.HairStrands.DeepShadow.Resolution=2048
r.HairStrands.DeepShadow.SuperSampling=1

; LUT and lighting
r.HairStrands.HairLUT.SampleCountScale=1
r.HairStrands.SkyAO.SampleCount=8
r.HairStrands.SkyLighting.SampleCount=16

; ---------- Skin / SSS ----------
; Higher quality skin and subsurface scattering
r.SSS.Quality=2
r.SSS.Burley.Quality=1
r.SSS.Checkerboard=0
r.SSS.HalfRes=0
r.SSS.SampleSet=2

; ---------- Post ----------
r.BloomQuality=5
r.DepthOfFieldQuality=4
r.MotionBlurQuality=0
r.Tonemapper.Quality=5

; ---------- TSR ----------
; High quality TSR history without hardware RT pressure
r.TSR.History.SampleCount=16
r.TSR.History.ScreenPercentage=100
r.TSR.History.UpdateQuality=3

; ---------- Reflections ----------
r.SSR.Quality=4

; ---------- GI ----------
r.SSGI.Quality=4

; ---------- Niagara ----------
fx.Niagara.QualityLevel=3

; ---------- RT fallback ----------
; Prevents forcing every RT feature on
r.RayTracing.ForceAllRayTracingEffects=-1
r.CEFGPUAcceleration=0

